[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-topology"
version = "0.1.0"
description = "Bounded offline GeoJSON network gap analysis and reproducible review bundles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
spatial-topology = "spatial_topology.__main__:main"

[tool.setuptools.packages.find]
include = ["spatial_topology*"]
