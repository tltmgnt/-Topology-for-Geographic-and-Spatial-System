name: Spatial topology CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Unit and end to end tests
        run: python -m unittest discover -s tests -v
      - name: Installed package replay workflows
        run: python tests/check_installed.py
      - name: Installed v2 replay and GeoPackage workflows
        run: python tests/check_v2_installed.py
      - name: Create downloadable synthetic review
        if: matrix.python-version == '3.12'
        run: |
          mkdir -p runs
          spatial-topology analyze examples/network.geojson --requirements examples/requirements.json --output runs/ci-demo
          spatial-topology verify runs/ci-demo
      - name: Upload synthetic review bundle
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-spatial-review
          path: runs/ci-demo/
          if-no-files-found: error
          retention-days: 7

  geospatial:
    runs-on: ubuntu-22.04
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: topology_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: topology_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topology_test -d topology_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SPATIAL_TOPOLOGY_TEST_DSN: postgresql://topology_test:synthetic_ci_only@localhost:5432/topology_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install optional geospatial adapters
        run: python -m pip install '.[geometry,postgis]'
      - name: Geometry and live PostGIS synthetic tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic benchmark smoke check
        run: python benchmarks/network.py
